parameters:
  - name: environment
    type: string
    default: 'prod'
    values:
      - prod
      - local
      - AB123

variables:
  ENABLESIMPLESAMLPHPSSO: 'true' # Set to 'true' to enable SimpleSAMLphp SSO deployment
  dockerRegistryServiceConnection: 'ilifes-acr-docker'
  dockerRepository: 'simplesamlphp'
  imageTag: 'latest'

stages:
  - stage: Build
    condition: eq(variables['ENABLESIMPLESAMLPHPSSO'], 'true')
    displayName: 'Build Stage'
    jobs:
      - job: BuildJob
        pool:
          name: 'Default'

        displayName: 'Build SimpleSAMLphp'
        steps:
          - script: |
              echo "Listing files after checkout:"
              ls -laR $(Pipeline.Workspace)
            displayName: 'Debug: List Workspace Files'

          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - task: Docker@2
            displayName: 'Build SimpleSAMLphp Image'
            inputs:
              command: build
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: simplesamlphp
              Dockerfile: $(Build.SourcesDirectory)/Dockerfile
              buildContext: $(Build.SourcesDirectory)
              tags: latest


          - task: Docker@2
            displayName: 'Push SimpleSAMLphp Image'
            condition: eq(variables['ENABLESIMPLESAMLPHPSSO'], 'true')
            inputs:
              command: push
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: simplesamlphp
              tags: latest

  - stage: Deploy
    displayName: 'Deploy Stage'
    dependsOn: Build
    condition: eq(variables['ENABLESIMPLESAMLPHPSSO'], 'true')
    jobs:
      - job: DeployJob
        displayName: "Deploy to ACR"
        pool:
          name: 'Default'

        steps:
          - script: |
              echo "Listing files after checkout:"
              ls -laR $(Pipeline.Workspace)
            displayName: 'Debug: List Workspace Files'

          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - script: |
              docker network inspect app-network >/dev/null 2>&1 || docker network create app-network

              docker-compose -f $(Build.SourcesDirectory)/docker-compose.yml down --remove-orphans || true
              docker-compose -f $(Build.SourcesDirectory)/docker-compose.yml pull
              docker-compose -f $(Build.SourcesDirectory)/docker-compose.yml up -d --build
            displayName: Deploy Containers

          - script: |
              echo "SimpleSAMLphp deployed successfully to environment: ${{ parameters.environment }}"
            displayName: 'Deployment Success Message'